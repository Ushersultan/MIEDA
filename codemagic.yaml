workflows:
  mieda-android-release:
    name: MIEDA - Android signed AAB
    # M2 is available on the individual free plan; Android builds also run on macOS.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      vars:
        # Version 12 (1.3.3) has already been uploaded to Google Play.
        # Increment this code before each subsequent Play upload.
        ANDROID_VERSION_CODE: "13"
        ANDROID_VERSION_NAME: "1.3.4"
      android_signing:
        - mieda_upload
      groups:
        - mieda_android
    # Manual builds only. No automatic Play publishing or webhook triggers.
    scripts:
      - name: Verify release configuration
        script: |
          set -eu
          node scripts/check-android-release.mjs
      - name: Install locked dependencies
        script: npm ci --no-fund
      - name: Build web content and native Android resources
        script: |
          set -eu
          if [ ! -d android ]; then npx cap add android; fi
          npm run android:prepare
      - name: Configure signing from secure environment
        script: node scripts/configure-android-signing.mjs
      - name: Build signed Android App Bundle
        script: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
